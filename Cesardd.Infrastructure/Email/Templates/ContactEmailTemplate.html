<div style="font-family: Arial, sans-serif; background-color: #f9fafb; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: #ffffff; border-radius: 10px; overflow: hidden; border: 1px solid #e5e7eb;">

        <!-- HEADER -->
        <div style="background: #2563eb; color: #ffffff; padding: 16px 20px;">
            <h2 style="margin: 0; font-size: 18px;">Mensaje recibido</h2>
        </div>

        <!-- BODY -->
        <div style="padding: 20px;">

            <!-- INFO -->
            <div style="margin-bottom: 16px;">
                <p style="margin: 0; font-size: 13px; color: #6b7280;">Nombre</p>
                <p style="margin: 0; font-weight: bold;">{{Name}}</p>
            </div>

            <div style="margin-bottom: 16px;">
                <p style="margin: 0; font-size: 13px; color: #6b7280;">Email</p>
                <p style="margin: 0; font-weight: bold;">{{Email}}</p>
            </div>

            <!-- DIVIDER -->
            <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;" />

            <!-- MESSAGE -->
            <div>
                <p style="margin: 0 0 8px 0; font-size: 13px; color: #6b7280;">Mensaje</p>

                <div style="
          background: #f3f4f6;
          padding: 12px;
          border-radius: 6px;
          font-size: 14px;
          color: #111827;
          word-break: break-word;
        ">
                    {{Message}}
                </div>
            </div>

        </div>

        <!-- FOOTER -->
        <div style="padding: 12px 20px; font-size: 12px; color: #9ca3af; text-align: center;">
            Enviado desde tu portafolio
        </div>

    </div>
</div>
