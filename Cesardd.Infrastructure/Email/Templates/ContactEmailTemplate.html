<div style="font-family:Arial, sans-serif;">

    <div style="max-width:600px; margin:auto; background:#ffffff; border-radius:8px; border:1px solid #e5e5e5; overflow:hidden;">

        <div style="padding:14px 20px; border-bottom:1px solid #e5e5e5; font-size:13px; color:#6b7280; letter-spacing:0.3px;">
            Nuevo mensaje
        </div>

        <div style="padding:14px 20px; border-bottom:1px solid #e5e5e5; font-size:14px; color:#6b7280;">
            De: <strong style="color:#111827;">{{Name}}</strong>
            &lt;{{Email}}&gt;
        </div>

        <div style="padding:16px 20px; font-size:14px; line-height:1.4; color:#111827;">
            {{Message}}
        </div>

        <div style=" padding:12px 20px; font-size:12px; color:#9ca3af; border-top:1px solid #e5e5e5; text-align:center;">
            Enviado desde tu portafolio
        </div>

    </div>
</div>
